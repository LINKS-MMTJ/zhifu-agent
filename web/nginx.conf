server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # compose 内置 DNS：配合变量式 proxy_pass 实现运行时重新解析，
    # 这样 docker compose --scale server=3 后新副本能被自动纳入
    resolver 127.0.0.11 valid=10s ipv6=off;

    # —— 前端静态资源（Vite 产物带 hash，可长期缓存）——
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # —— API 反向代理到后端容器 ——
    location /api/ {
        set $backend "http://server:4000";
        proxy_pass $backend;
        proxy_http_version 1.1;
        # 知识库文件上传单文件上限 50MB，nginx 默认 1MB 会直接 413
        client_max_body_size 60m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 多副本时，某个后端出错自动切下一个
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # SSE 流式必需：关闭缓冲，否则前端拿不到逐字输出
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # —— PWA：Service Worker 不缓存，保证更新及时生效 ——
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # —— SPA 路由回退 ——
    location / {
        try_files $uri $uri/ /index.html;
    }
}
