name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: 后端测试 + 评测门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # 单元 + 端到端，不依赖任何 API Key（离线 Mock 模型）
      - run: npm test
      # 1 万条评测：任何分类低于阈值、或成本跑偏都会让流水线失败
      - run: npm run eval:gate

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
